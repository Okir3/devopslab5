name: Build and Delivery

# Задайте правило, при котором рабочий процесс будет запускаться только после
# завершения рабочего процесса Test Python App в ветке main
on:
  workflow_run:
    workflows: ["Test Python App"]
    types:
      - completed
    branches:
      - main

jobs:
  cd:
    if: ${{ github.event.workflow_run.conclusion == 'success' }} # для гарантии запуска при успешном выполнении
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devopslab5:latest
