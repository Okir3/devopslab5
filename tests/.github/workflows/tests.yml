name: Test Python App

on:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest # машина

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # получение репозитория

      - name: Setup Python
        uses: actions/setup-python@v5 # настройка питона
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pytest httpx pydantic-settings

      - name: Run tests
        run: python -m pytest tests/ # Шаг с запуском тестов
